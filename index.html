<!doctype html>
<html style="background-color: #fcb1e3;">
    <head>
        <script src="https://lepripri.github.io/allPages.js"></script>
        <script>
            var translation = {
                test: {
                    fr: true,
                    en: true
                },
                title: {
                    fr: "tous les jeux le pripri",
                    en: "all le pripri games"
                },
                description: {
                    fr: "des jeux pour se divertir ! plus de 4 jeux sont disponible sur le pripri.",
                    en: "all le pripri games are free ! more than 4 games are available in le pripri website."
                },
                aLppTrVL: {
                    fr: "les aventures pripri voyageur - partie 1",
                    en: "pripri anventures and travel - part 1"
                },
                TaBC: {
                    fr: "block puzzle blast : 2 type de jeu",
                    en: "block puzzle blast in 2 type"
                },
                balleclat: {
                    fr: "éclate ballons",
                    en: "balloon popper"
                },
                ballreb: {
                    fr: "balle rebondissante",
                    en: "bouncing ball"
                }
            }
            if (translation.test[localStorage.lang.substring(0, 2)]) {
                var lang = localStorage.lang.substring(0, 2)
            } else {
                var lang = "en"
            }
            lepripriAPI.import.pageCreatorEditor();
            var changer = lepripriAPI.imported.API.currentPage.change
            changer.presetLppPage("itemlist", 'big', translation.title[lang], changer.pressetType.itemList.parrametters("", "", translation.description[lang], [
                changer.pressetType.itemList.generateItem("aLppTrVL", translation.aLppTrVL[lang], "https://lepripri.github.io/games/lepripri/aLppTrVL.html", "index/Capture d'écran 2025-11-21 130618.png"),
                changer.pressetType.itemList.generateItem("TaBC", translation.TaBC[lang], "https://lepripri.github.io/games/lepripri/blockpuzzle_tetris/", "index/comboTBB.png"),
                changer.pressetType.itemList.generateItem("balleclat", translation.balleclat[lang], "https://lepripri.github.io/games/lepripri/balleclat", "index/balleclat.png"),
                changer.pressetType.itemList.generateItem("ballreb", translation.ballreb[lang], "https://lepripri.github.io/games/lepripri/ballreb.html", "index/ballreb.gif", false, "-35px")
            ]));
        </script>
    </head>
    <body></body>
</html>
